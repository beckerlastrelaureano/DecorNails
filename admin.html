<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/iconos/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Decor Nails — Panel</title>
</head>
<body>

<header class="encabezado">
  <img class="marca-logo" src="assets/iconos/logo-mark.png" alt="Decor Nails">
  <h1>Decor Nails</h1>
  <p class="responsable">Panel de Magali — este link no se comparte</p>
</header>

<main class="contenedor">

  <div class="tabs-admin">
    <button class="tab-admin activa" id="tab-agenda" type="button">Agenda</button>
    <button class="tab-admin" id="tab-hoy" type="button">Turnos de hoy</button>
  </div>

  <!-- AGENDA -->
  <section id="vista-agenda">
    <div class="selector-fecha">
      <button id="btn-dia-anterior" type="button" aria-label="Día anterior">‹</button>
      <input type="date" id="input-fecha">
      <button id="btn-dia-siguiente" type="button" aria-label="Día siguiente">›</button>
    </div>

    <h2 class="dia-titulo" id="dia-titulo"></h2>

    <div class="acciones-bloqueo" id="acciones-bloqueo"></div>

    <div id="dia-cerrado" class="dia-cerrado oculto">
      Domingo — el salón no atiende este día.
    </div>

    <div id="lista-agenda" class="lista-franjas"></div>
  </section>

  <!-- TURNOS DE HOY -->
  <section id="vista-hoy" class="oculto">
    <h2 class="dia-titulo" id="hoy-titulo"></h2>
    <div id="lista-hoy"></div>
    <div class="total-dia oculto" id="total-hoy"></div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/marca.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
